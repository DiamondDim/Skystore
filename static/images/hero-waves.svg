<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8C4A0;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8A9A5B;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8D1B5;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#A3B18A;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D8DFC8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#B8C4A0;stop-opacity:0.25" />
    </linearGradient>
  </defs>

  <!-- Волна 1 (самая светлая, фон) -->
  <path d="M0,200 C200,150 400,250 600,200 C800,150 1000,250 1200,200 L1200,400 L0,400 Z"
        fill="url(#wave3)" opacity="0.4"/>

  <!-- Волна 2 (средняя) -->
  <path d="M0,220 C250,180 450,260 650,220 C850,180 1050,260 1200,220 L1200,400 L0,400 Z"
        fill="url(#wave2)" opacity="0.5"/>

  <!-- Волна 3 (передняя, более выраженная) -->
  <path d="M0,240 C300,200 500,280 700,240 C900,200 1100,280 1200,240 L1200,400 L0,400 Z"
        fill="url(#wave1)" opacity="0.6"/>
</svg>
