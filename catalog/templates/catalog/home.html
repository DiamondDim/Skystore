{% extends 'catalog/base.html' %}

{% block title %}Skystore — Главная{% endblock %}

{% block content %}
<!-- HERO SECTION: Только визитка -->
<section class="hero-section text-center py-5 my-5">
    <div class="container">
        <h1 class="display-3 fw-light text-olive-green mb-4">Skystore</h1>
        <p class="lead text-muted mx-auto mb-5" style="max-width: 700px; line-height: 1.6;">
            Skystore — это отличный вариант хранения ваших плагинов и примеров кода, который вы бы хотели продать.
        </p>

        <!-- Кнопка перехода в каталог -->
        <a href="{% url 'catalog_list' %}" class="btn btn-buy btn-lg px-5 py-3 rounded-pill shadow-sm">
            Перейти в каталог &darr;
        </a>
    </div>
</section>
{% endblock %}
