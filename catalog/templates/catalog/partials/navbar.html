{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-olive-green fw-bold" href="{% url 'home' %}">Skystore</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'catalog_list' %}active-nav{% endif %}"
                       href="{% url 'catalog_list' %}">Каталог</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'post_list' %}active-nav{% endif %}"
                       href="{% url 'post_list' %}">Блог</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'contacts' %}active-nav{% endif %}"
                       href="{% url 'contacts' %}">Контакты</a>
                </li>
            </ul>

            <div class="d-flex gap-2 align-items-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'add_product' %}" class="btn btn-buy rounded-pill px-4 py-2">
                        + Добавить продукт
                    </a>
                    <a href="{% url 'post_create' %}" class="btn btn-outline-olive rounded-pill px-4 py-2">
                        + Новая статья
                    </a>

                    <!-- Безопасный выход через POST-запрос -->
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                            Выход
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-buy rounded-pill px-4 py-2">
                        Войти
                    </a>
                    <a href="{% url 'register' %}" class="btn btn-outline-olive rounded-pill px-4 py-2">
                        Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
