{% extends 'catalog/base.html' %}

{% block title %}Контакты — Skystore{% endblock %}

{% block content %}
<div class="row g-5 align-items-start">
    <!-- Левая колонка: Информация о компании -->
    <div class="col-md-5">
        <h2 class="text-olive-green mb-4">Контакты</h2>
        <div class="contact-info p-4 bg-white rounded shadow-sm border border-olive-subtle">
            <table class="table table-borderless mb-0">
                <tbody>
                    <tr>
                        <td class="text-muted fw-medium pe-3">Страна:</td>
                        <td>USA</td>
                    </tr>
                    <tr>
                        <td class="text-muted fw-medium pe-3">ИНН:</td>
                        <td>91-1144442</td>
                    </tr>
                    <tr>
                        <td class="text-muted fw-medium pe-3">Адрес:</td>
                        <td>Redmond, WA, 98052-6399</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Правая колонка: Форма -->
    <div class="col-md-7">
        <h2 class="text-olive-green mb-4">Свяжитесь с нами</h2>
        <form method="post" id="contact-form" class="bg-white p-4 rounded shadow-sm border border-olive-subtle">
            {% csrf_token %}

            <div class="mb-4">
                <label for="name" class="form-label text-muted small text-uppercase fw-bold">Имя</label>
                <input type="text" class="form-control form-control-lg border-olive-subtle" id="name" name="name" required placeholder="Как вас зовут?">
            </div>

            <div class="mb-4">
                <label for="phone-input" class="form-label text-muted small text-uppercase fw-bold">Телефон</label>
                <input type="tel" class="form-control form-control-lg border-olive-subtle" id="phone-input" name="phone" required>
            </div>

            <div class="mb-4">
                <label for="message" class="form-label text-muted small text-uppercase fw-bold">Сообщение</label>
                <textarea class="form-control form-control-lg border-olive-subtle" id="message" name="message" rows="4" required placeholder="Чем можем помочь?"></textarea>
            </div>

            <button type="submit" class="btn btn-buy w-100 py-3">Отправить</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const phoneInputField = document.querySelector("#phone-input");
    if (phoneInputField) {
        const iti = window.intlTelInput(phoneInputField, {
            initialCountry: "auto",
            geoIpLookup: function(callback) {
                fetch('https://ipapi.co/json/')
                    .then(response => response.json())
                    .then(data => callback(data.country_code))
                    .catch(() => callback("us"));
            },
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js",
        });

        const form = document.getElementById('contact-form');
        form.addEventListener('submit', function(e) {
            if (!iti.isValidNumber()) {
                e.preventDefault();
                alert('Пожалуйста, введите корректный номер телефона.');
            } else {
                phoneInputField.value = iti.getNumber();
            }
        });
    }
});
</script>
{% endblock %}
