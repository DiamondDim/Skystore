{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи — Skystore{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h3 class="text-olive-green mb-3">Удалить статью?</h3>
                <p class="text-muted mb-4">Вы уверены, что хотите удалить "{{ post.title }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">Да, удалить</button>
                    <a href="{% url 'post_detail' post.pk %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
